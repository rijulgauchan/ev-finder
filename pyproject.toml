[project]
name = "ev-finder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "typer>=0.27.1",
]

[project.scripts]
ev-finder = "ev_finder.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "requests-mock>=1.12.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Wide fixture CSV literal (real data columns), not worth wrapping.
"tests/test_historical_loader.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
